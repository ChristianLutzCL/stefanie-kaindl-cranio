<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editorial Olive — Quote</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
</head>
<body>
<div class="eo-band-deep" style="padding:40px 0">
  <div class="eo-shell" style="max-width:1000px">
    <div style="display:grid;gap:32px;grid-template-columns:minmax(0,7fr)">
      <div>
        <span class="eo-label eo-label-caps">Stimmen</span>
        <span class="eo-display" style="display:block;margin-top:16px;font-size:1.25rem;font-weight:300;font-variant-numeric:tabular-nums">01<span style="color:var(--ink-500)">/04</span></span>
      </div>
      <blockquote style="margin:0">
        <p class="eo-quote">&bdquo;Die Behandlung bei Steffi ist eine Wohltat für Körper, Geist und Seele. Nach der Cranio fühle ich mich viel leichter und meine Gedanken kommen zur Ruhe.&ldquo;</p>
        <div class="eo-hairline" style="margin-top:56px"></div>
        <footer class="eo-quote-foot">
          <span style="display:flex;align-items:center;gap:12px">
            <span class="eo-initials" aria-hidden="true">KP</span>
            <span>
              <span class="eo-quote-name">Kathi P.</span>
              <span class="eo-quote-role">Stress &amp; Verspannungen</span>
            </span>
          </span>
        </footer>
      </blockquote>
    </div>
  </div>
</div>
</body>
</html>
