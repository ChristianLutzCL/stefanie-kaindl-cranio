<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editorial Olive — Photo</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
</head>
<body>
<div class="eo-shell" style="max-width:1000px;padding-block:28px">
  <div style="display:grid;gap:24px;grid-template-columns:repeat(3,minmax(0,1fr))">
    <figure class="eo-ph" style="margin:0;aspect-ratio:4/5">
      <img src="../../assets/Imagery/hero-stefanie.webp" alt="Stefanie Kaindl im Behandlungsraum" style="object-position:50% 30%">
    </figure>
    <figure class="eo-ph" style="margin:0;aspect-ratio:4/5">
      <img src="../../assets/Imagery/behandlung_2.webp" alt="Hände halten die Füße während einer craniosacralen Behandlung" style="object-position:50% 45%">
    </figure>
    <figure class="eo-ph eo-ph-deep" style="margin:0;aspect-ratio:4/5">
      <img src="../../assets/Imagery/yoga.webp" alt="Yoga-Haltung auf der Matte" style="object-position:38% 50%">
    </figure>
  </div>
  <p class="eo-small" style="margin-top:16px">Links und Mitte: <code>.ph</code> mit der Standard-Gradiation (Olive-Multiplikation 14 %). Rechts: <code>.ph-deep</code> (42 %) — für Motive, die als dunkle Fläche tragen sollen.</p>
</div>
</body>
</html>
