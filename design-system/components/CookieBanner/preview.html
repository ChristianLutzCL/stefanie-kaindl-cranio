<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editorial Olive — CookieBanner</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
</head>
<body>
<div style="position:relative;min-height:260px;background:var(--paper)">
  <div class="eo-cookie eo-banner-in" style="position:absolute;left:0;right:0;bottom:0">
    <div class="eo-shell" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;padding-block:24px">
      <p style="margin:0;max-width:42rem;font-size:0.8125rem;line-height:1.625;color:var(--cream-70)">
        <span class="eo-label eo-label-inverse eo-label-caps">Cookies</span>
        <span style="display:block;margin-top:8px">Diese Website nutzt Cookies. Notwendige sind immer aktiv; Statistik und Marketing nur, wenn du zustimmst. Deine Auswahl kannst du jederzeit ändern.</span>
      </p>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 32px;flex:none">
        <a href="#" class="eo-cta-link" style="font-size:0.8125rem">Einstellungen</a>
        <button type="button" class="eo-cta-link" style="font-size:0.8125rem;background:none;border:0;cursor:pointer">Nur notwendige akzeptieren</button>
        <button type="button" class="eo-btn eo-btn-cream" style="padding:0.875rem 1.5rem;font-size:0.75rem;font-weight:500;letter-spacing:0.025em">Akzeptieren</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
