<div class="eo-section-tight">
  <div class="eo-shell" style="max-width:900px">

      <span class="eo-label eo-label-caps">Zwei Wege zur Ruhe</span>
      <h2 class="eo-display eo-display-serif eo-d2" style="margin:24px 0 0">Zwei Kurse am Donnerstag.</h2>

  </div>

      <h2 class="eo-display eo-display-serif eo-d2" style="margin:24px 0 0;color:var(--cream)">Yoga für Körper und Geist.</h2>

  </div>
