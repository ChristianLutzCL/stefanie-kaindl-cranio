<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editorial Olive — Field</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
</head>
<body>
<div class="eo-shell" style="max-width:640px;padding-block:36px">
  <form class="eo-field-group" onsubmit="return false">
    <div class="eo-field-2">
      <label class="eo-field-label"><span class="eo-meta-line">Name</span><input class="eo-field" type="text" value=""></label>
      <label class="eo-field-label"><span class="eo-meta-line">E-Mail *</span><input class="eo-field" type="email" value=""></label>
    </div>
    <label class="eo-field-label"><span class="eo-meta-line">Telefon (optional)</span><input class="eo-field" type="tel" placeholder="+49"></label>
    <label class="eo-field-label"><span class="eo-meta-line">Nachricht *</span><textarea class="eo-field" rows="4"></textarea></label>
    <p class="eo-field-hint">Mit dem Absenden stimmst du zu, dass deine Angaben zur Bearbeitung der Anfrage gespeichert werden. Mehr dazu in der <a href="#" style="color:var(--ink)">Datenschutzerklärung</a>.</p>
    <div><button type="button" class="eo-btn eo-btn-ink">Nachricht senden</button></div>
  </form>
</div>
</body>
</html>
